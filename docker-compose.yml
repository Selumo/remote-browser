# Dokploy: create a Compose service from this repository, set the variables from .env.example in
# the Environment tab, and add a domain for service `app`, port 3000. For claude.ai connectors put
# Cloudflare Access (managed OAuth) in front of /mcp-oauth only.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    shm_size: "2gb"
    expose:
      - "3000"
    environment:
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MCP_TOKEN=${MCP_TOKEN:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - SCHEDULE_TZ=${SCHEDULE_TZ:-Asia/Seoul}
      - CHALLENGE_WAIT_MINUTES=${CHALLENGE_WAIT_MINUTES:-10}
      - NOTIFY_URL=${NOTIFY_URL:-}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-1920}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-1080}
      - VNC_COMPRESSION=${VNC_COMPRESSION:-6}
      - VNC_QUALITY=${VNC_QUALITY:-medium}
    volumes:
      - data:/data

volumes:
  data:
